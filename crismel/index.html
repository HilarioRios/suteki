<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>¿Me quieres Crismel? 💌</title>
  <meta name="description" content="Tengo una pregunta muy importante para ti…" />
  <meta property="og:title" content="¿Me quieres Crismel? 💌" />
  <meta property="og:description" content="Tengo una pregunta muy importante para ti…" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#ffe9ee" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
  <link rel="preload" as="video" href="/reply.mp4" type="video/mp4" />
  <style>
    :root {
      --fondo: #ffe9ee;
      --fondo-2: #ffd4e0;
      --tinta: #8c2f45;
      --rosa: #ff5c77;
      --rosa-suave: #ffc2cd;
      --blanco: #fffafb;
      --fuente: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN",
        Quicksand, "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--fuente);
      color: var(--tinta);
      background: linear-gradient(180deg, var(--fondo) 0%, var(--fondo-2) 100%);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── corazones flotantes de fondo ─────────────────── */
    .cielo {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .corazon-flotante {
      position: absolute;
      bottom: -8vh;
      opacity: 0;
      will-change: transform, opacity;
      animation: flotar linear infinite;
    }
    @keyframes flotar {
      0%   { transform: translateY(0) rotate(-8deg); opacity: 0; }
      10%  { opacity: .45; }
      90%  { opacity: .3; }
      100% { transform: translateY(-115vh) rotate(10deg); opacity: 0; }
    }

    /* ── pantallas ────────────────────────────────────── */
    .pantalla {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3.2dvh, 26px);
      padding: max(18px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px) scale(.98);
      transition: opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
    }
    .pantalla.activa {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      transition: opacity .45s ease, transform .45s ease;
    }

    .marco-video {
      width: min(64vw, 34dvh, 260px);
      aspect-ratio: 1 / 1;
      border-radius: 26px;
      overflow: hidden;
      background: var(--blanco);
      box-shadow: 0 16px 40px rgba(255, 92, 119, .3);
      flex: none;
    }
    .marco-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    /* respaldo si el video no puede cargar: osito emoji */
    .marco-video .respaldo {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: clamp(70px, 30vw, 120px);
      background: linear-gradient(160deg, #fff0f4, #ffd9e3);
    }
    .marco-video.sin-video video { display: none; }
    .marco-video.sin-video .respaldo { display: flex; }

    h1 {
      font-size: clamp(1.9rem, 9vw, 2.6rem);
      margin: 0;
      line-height: 1.12;
      text-wrap: balance;
    }

    .nota {
      margin: 0;
      font-size: .95rem;
      opacity: .6;
    }

    /* ── botones ──────────────────────────────────────── */
    .fila-botones {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 16px 38px;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      min-width: 120px;
      min-height: 56px;
    }
    .btn:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }

    .btn-si {
      background: var(--rosa);
      box-shadow: 0 8px 22px rgba(255, 92, 119, .5);
      animation: latido 1.5s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes latido {
      0%, 100% { transform: scale(var(--crecer, 1)); }
      50%      { transform: scale(calc(var(--crecer, 1) * 1.08)); }
    }

    .btn-no {
      background: var(--rosa-suave);
      color: var(--tinta);
      box-shadow: 0 5px 14px rgba(140, 47, 69, .2);
      will-change: transform;
    }
    /* cuando huye, se mueve por TODA la pantalla */
    .btn-no.huyendo {
      position: fixed;
      z-index: 10;
      margin: 0;
      transition: left .28s cubic-bezier(.2, .9, .3, 1.2), top .28s cubic-bezier(.2, .9, .3, 1.2);
    }

    /* ── corazón cargando ─────────────────────────────── */
    .latiendo {
      font-size: clamp(80px, 22vw, 120px);
      display: inline-block;
      animation: palpitar .8s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes palpitar {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.28); }
      60% { transform: scale(.94); }
    }
    #cargando p {
      font-size: 1.15rem;
      margin: 0;
      opacity: .75;
    }

    /* ── resultado ────────────────────────────────────── */
    #resultado h1 { font-size: clamp(2rem, 10vw, 2.8rem); }
    #resultado .mensaje {
      font-size: clamp(1.15rem, 5.4vw, 1.45rem);
      font-weight: 700;
      margin: 0;
      color: var(--rosa);
    }

    /* ── confeti de corazones ─────────────────────────── */
    .confeti {
      position: fixed;
      top: -8vh;
      pointer-events: none;
      z-index: 20;
      will-change: transform, opacity;
      animation: caer ease-in forwards;
    }
    @keyframes caer {
      to { transform: translateY(120vh) rotate(340deg); opacity: .15; }
    }

    @media (prefers-reduced-motion: reduce) {
      .corazon-flotante, .confeti { animation: none; display: none; }
      .btn-si, .latiendo { animation: none; }
      .pantalla, .btn-no.huyendo { transition: none; }
    }
  </style>
</head>
<body>

<div class="cielo" id="cielo"></div>

<!-- pregunta -->
<section class="pantalla activa" id="pregunta">
  <div class="marco-video">
    <video src="/reply.mp4" autoplay muted loop playsinline preload="auto"></video>
    <div class="respaldo">🐻💌</div>
  </div>
  <h1>¿Me quieres Crismel?&nbsp;🥺</h1>
  <div class="fila-botones">
    <button class="btn btn-si" id="btnSi">Sí 💖</button>
    <button class="btn btn-no" id="btnNo">No</button>
  </div>
  <p class="nota">Piénsalo bien…</p>
</section>

<!-- cargando -->
<section class="pantalla" id="cargando">
  <span class="latiendo">💗</span>
  <p>Guardando tu respuesta…</p>
</section>

<!-- resultado -->
<section class="pantalla" id="resultado">
  <div class="marco-video">
    <video src="/love.mp4" muted loop playsinline preload="auto"></video>
    <div class="respaldo">🥰💖</div>
  </div>
  <h1>¡Lo sabía! 😍</h1>
  <p class="mensaje">Feliz cumple messss 🎂💕</p>
</section>

<script>
  const pantallas = {
    pregunta: document.getElementById("pregunta"),
    cargando: document.getElementById("cargando"),
    resultado: document.getElementById("resultado"),
  };
  const btnSi = document.getElementById("btnSi");
  const btnNo = document.getElementById("btnNo");

  // ── reproducción robusta de videos en celular ──
  // Algunos teléfonos (iPhone en ahorro de batería, redes lentas) bloquean
  // el autoplay o tardan en cargar: reintentamos y, si de plano no puede,
  // mostramos un emoji en su lugar para que nunca se vea un cuadro vacío.
  function vigilarVideo(video) {
    const marco = video.closest(".marco-video");
    const intentar = () => { if (video.paused) video.play().catch(() => {}); };

    video.addEventListener("canplay", () => {
      marco.classList.remove("sin-video");
      intentar();
    });
    video.addEventListener("error", () => marco.classList.add("sin-video"));

    // si tras 6s no cargó nada, mostrar respaldo (se quita solo si luego carga)
    setTimeout(() => {
      if (video.readyState < 2) {
        marco.classList.add("sin-video");
        video.load(); // un reintento de carga
      }
    }, 6000);
    return intentar;
  }

  const videoPregunta = pantallas.pregunta.querySelector("video");
  const videoResultado = pantallas.resultado.querySelector("video");
  const reproducirPregunta = vigilarVideo(videoPregunta);
  vigilarVideo(videoResultado);

  // al primer toque en cualquier parte, despertar el video si está pausado
  document.addEventListener("pointerdown", reproducirPregunta, { once: false });

  function mostrar(nombre) {
    for (const p of Object.values(pantallas)) p.classList.remove("activa");
    pantallas[nombre].classList.add("activa");
  }

  // corazones flotantes de fondo
  const cielo = document.getElementById("cielo");
  const simbolos = ["💗", "💕", "💖", "🩷", "❤️"];
  for (let i = 0; i < 10; i++) {
    const c = document.createElement("span");
    c.className = "corazon-flotante";
    c.textContent = simbolos[i % simbolos.length];
    c.style.left = Math.random() * 94 + "%";
    c.style.fontSize = 15 + Math.random() * 16 + "px";
    c.style.animationDuration = 8 + Math.random() * 8 + "s";
    c.style.animationDelay = -Math.random() * 14 + "s";
    cielo.appendChild(c);
  }

  // ── el botón "No" huye por toda la pantalla ──
  let escapadas = 0;
  const excusas = ["No", "¿Segura? 🤨", "Piénsalo 🥹", "Última chance", "😢", "Di que sí 💘"];

  function huir() {
    escapadas++;

    // primera huida: fijar posición actual antes de soltarlo
    if (!btnNo.classList.contains("huyendo")) {
      const r = btnNo.getBoundingClientRect();
      btnNo.classList.add("huyendo");
      btnNo.style.left = r.left + "px";
      btnNo.style.top = r.top + "px";
      // forzar reflow para que la transición aplique desde aquí
      btnNo.getBoundingClientRect();
    }

    const margen = 14;
    const w = btnNo.offsetWidth;
    const h = btnNo.offsetHeight;
    const maxX = window.innerWidth - w - margen;
    const maxY = window.innerHeight - h - margen;

    // nueva posición lejos de la actual para que se note el salto
    const actual = btnNo.getBoundingClientRect();
    let x, y, intentos = 0;
    do {
      x = margen + Math.random() * (maxX - margen);
      y = margen + Math.random() * (maxY - margen);
      intentos++;
    } while (Math.hypot(x - actual.left, y - actual.top) < 130 && intentos < 12);

    btnNo.style.left = x + "px";
    btnNo.style.top = y + "px";
    btnNo.textContent = excusas[Math.min(escapadas, excusas.length - 1)];

    // el "Sí" crece cada vez que el "No" escapa
    btnSi.style.setProperty("--crecer", Math.min(1 + escapadas * 0.06, 1.45));

    if (navigator.vibrate) navigator.vibrate(30);
  }

  btnNo.addEventListener("pointerdown", (e) => { e.preventDefault(); huir(); });
  btnNo.addEventListener("mouseenter", huir);
  btnNo.addEventListener("click", (e) => e.preventDefault());

  // ── botón "Sí" ──
  btnSi.addEventListener("click", () => {
    btnNo.remove();
    mostrar("cargando");
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);

    setTimeout(() => {
      mostrar("resultado");
      const video = pantallas.resultado.querySelector("video");
      video.play().catch(() => {});
      lloverCorazones();
    }, 1900);
  });

  function lloverCorazones() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < 26; i++) {
      setTimeout(() => {
        const c = document.createElement("span");
        c.className = "confeti";
        c.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
        c.style.left = Math.random() * 94 + "vw";
        c.style.fontSize = 18 + Math.random() * 16 + "px";
        c.style.animationDuration = 1.9 + Math.random() * 1.6 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3800);
      }, i * 85);
    }
  }
</script>

</body>
</html>
